name: GitLab Commits Graph

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Install Python & dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip
          pip install matplotlib requests python-dateutil

      - name: Generate area chart from GitLab commits
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          GITLAB_USERNAME: ${{ secrets.GITLAB_USERNAME }}
        run: |
          python3 <<EOF
          import requests, os
          from collections import Counter
          from datetime import datetime, timedelta
          import matplotlib.pyplot as plt
          import matplotlib.dates as mdates
          from dateutil import parser

          TOKEN = os.environ["GITLAB_TOKEN"]
          USERNAME = os.environ["GITLAB_USERNAME"]

          headers = {"PRIVATE-TOKEN": TOKEN}

          # Get all projects where user is a member (with pagination)
          projects_url = "https://gitlab.com/api/v4/projects?membership=true&per_page=100"
          all_projects = []
          page = 1
          while True:
              projects = requests.get(projects_url + f"&page={page}", headers=headers).json()
              if not isinstance(projects, list) or len(projects) == 0:
                  break
              all_projects.extend(projects)
              if len(projects) < 100:
                  break
              page += 1

          today = datetime.utcnow()
          since = (today - timedelta(days=29)).isoformat() + "Z"
          until = today.isoformat() + "Z"

          commits_per_day = Counter()

          for project in all_projects:
              project_id = project["id"]
              # Fetch commits for the last 30 days for each project (with pagination)
              commits_url = f"https://gitlab.com/api/v4/projects/{project_id}/repository/commits?since={since}&until={until}&per_page=100"
              page_commit = 1
              while True:
                  commits = requests.get(commits_url + f"&page={page_commit}", headers=headers).json()
                  if not isinstance(commits, list) or len(commits) == 0:
                      break
                  for commit in commits:
                      if commit.get("author_email", "").lower() == os.environ["GITLAB_EMAIL"].lower():
                          dt = parser.isoparse(commit["created_at"])
                          commits_per_day[dt.date()] += 1
                  if len(commits) < 100:
                      break
                  page_commit += 1

          days_ago = today - timedelta(days=29)
          days = [days_ago.date() + timedelta(days=i) for i in range(30)]
          counts = [commits_per_day.get(day, 0) for day in days]

          # Area chart
          plt.figure(figsize=(9, 3))
          plt.fill_between(days, counts, color='#fca326', alpha=0.4)
          plt.plot(days, counts, marker='o', color='#fca326', linewidth=2)
          plt.gca().xaxis.set_major_formatter(mdates.DateFormatter('%m-%d'))
          plt.xticks(rotation=45, fontsize=8)
          plt.yticks(fontsize=8)
          plt.title("GitLab Commit Activity (Last 30 Days)", fontsize=11, weight='bold')
          plt.grid(axis='y', linestyle='--', linewidth=0.5, alpha=0.7)
          plt.xlabel("Date", fontsize=9)
          plt.ylabel("Commits", fontsize=9)
          plt.tight_layout()
          plt.savefig("gitlab-commit-graph.png")
          EOF

      - name: Commit & Push updated graph
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add gitlab-commit-graph.png
          git diff --cached --quiet || git commit -m "update: GitLab commit graph [skip ci]"
          git pull --rebase
          git push
