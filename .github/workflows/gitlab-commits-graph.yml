name: GitLab Commits Graph

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Install Python & dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip
          pip install matplotlib requests python-dateutil

      - name: Ambil data commit GitLab
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          GITLAB_USERNAME: ${{ secrets.GITLAB_USERNAME }}
        run: |
          python3 <<EOF
          import requests, os
          from collections import Counter
          from datetime import datetime, timedelta
          import matplotlib.pyplot as plt
          import matplotlib.dates as mdates
          from dateutil import parser

          TOKEN = os.environ["GITLAB_TOKEN"]
          USERNAME = os.environ["GITLAB_USERNAME"]

          headers = {"PRIVATE-TOKEN": TOKEN}
          url = f"https://gitlab.com/api/v4/users/{USERNAME}/events?action=pushed&per_page=100"
          resp = requests.get(url, headers=headers)
          events = resp.json()

          # Hitung commit per hari selama 30 hari terakhir
          today = datetime.utcnow()
          days_ago = today - timedelta(days=29)
          commits_per_day = Counter()

          for event in events:
              if 'created_at' in event:
                  dt = parser.isoparse(event['created_at'])
                  if dt.date() >= days_ago.date():
                      # Set ke tanggal UTC, hanya tanggal
                      commits_per_day[dt.date()] += 1

          days = [days_ago.date() + timedelta(days=i) for i in range(30)]
          counts = [commits_per_day.get(day, 0) for day in days]

          # Buat grafik
          plt.figure(figsize=(8,2))
          plt.bar(days, counts, color="#fca326")
          plt.gca().xaxis.set_major_formatter(mdates.DateFormatter('%m-%d'))
          plt.xticks(rotation=45, fontsize=7)
          plt.yticks(fontsize=7)
          plt.title("GitLab Commit 30 Hari Terakhir", fontsize=9)
          plt.tight_layout()
          plt.savefig("gitlab-commit-graph.png")
          EOF

      - name: Lihat perubahan file
        run: |
          ls -lah gitlab-commit-graph.png
          git status

      - name: Commit & Push graph
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add gitlab-commit-graph.png
          git commit -m "update: GitLab commit graph [skip ci]" || echo "No changes to commit"
          git pull --rebase
          git push
