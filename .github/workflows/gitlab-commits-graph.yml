name: GitLab Commits Graph

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Install Python & dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip
          pip install matplotlib requests python-dateutil

      - name: Generate area chart from GitLab commits
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          GITLAB_PROJECT_ID: ${{ secrets.GITLAB_PROJECT_ID }}
          GITLAB_EMAIL: ${{ secrets.GITLAB_EMAIL }}
          GITLAB_AUTHOR_NAME: ${{ secrets.GITLAB_AUTHOR_NAME }}
        run: |
          python3 <<EOF
          import requests, os
          from collections import Counter
          from datetime import datetime, timedelta
          import matplotlib.pyplot as plt
          import matplotlib.dates as mdates
          from dateutil import parser

          TOKEN = os.environ["GITLAB_TOKEN"]
          PROJECT_ID = os.environ["GITLAB_PROJECT_ID"]
          AUTHOR_EMAIL = os.environ.get("GITLAB_EMAIL", "").lower()
          AUTHOR_NAME = os.environ.get("GITLAB_AUTHOR_NAME", "")

          headers = {"PRIVATE-TOKEN": TOKEN}

          today = datetime.utcnow()
          since = (today - timedelta(days=29)).isoformat() + "Z"
          until = today.isoformat() + "Z"

          commits_per_day = Counter()

          page_commit = 1
          while True:
              commits_url = f"https://gitlab.com/api/v4/projects/{PROJECT_ID}/repository/commits?since={since}&until={until}&per_page=100&page={page_commit}"
              commits = requests.get(commits_url, headers=headers).json()
              if not isinstance(commits, list) or len(commits) == 0:
                  break
              for commit in commits:
                  print("==== COMMIT ====")
                  print(commit)  # CETAK DATA MENTAH KE LOG
                  email_match = (
                      (AUTHOR_EMAIL and commit.get("author_email", "").lower() == AUTHOR_EMAIL) or
                      (AUTHOR_EMAIL and commit.get("committer_email", "").lower() == AUTHOR_EMAIL)
                  )
                  name_match = (
                      (AUTHOR_NAME and commit.get("author_name", "") == AUTHOR_NAME) or
                      (AUTHOR_NAME and commit.get("committer_name", "") == AUTHOR_NAME)
                  )
                  if email_match or name_match:
                      dt = parser.isoparse(commit["created_at"])
                      commits_per_day[dt.date()] += 1
              if len(commits) < 100:
                  break
              page_commit += 1

          days_ago = today - timedelta(days=29)
          days = [days_ago.date() + timedelta(days=i) for i in range(30)]
          counts = [commits_per_day.get(day, 0) for day in days]

          print("Commits per day:", commits_per_day)
          print("Total commits found:", sum(counts))

          plt.figure(figsize=(9, 3))
          plt.fill_between(days, counts, color='#fca326', alpha=0.4)
          plt.plot(days, counts, marker='o', color='#fca326', linewidth=2)
          plt.gca().xaxis.set_major_formatter(mdates.DateFormatter('%m-%d'))
          plt.xticks(rotation=45, fontsize=8)
          plt.yticks(fontsize=8)
          plt.title("GitLab Commit Activity (Last 30 Days)", fontsize=11, weight='bold')
          plt.grid(axis='y', linestyle='--', linewidth=0.5, alpha=0.7)
          plt.xlabel("Date", fontsize=9)
          plt.ylabel("Commits", fontsize=9)
          plt.tight_layout()
          plt.savefig("gitlab-commit-graph.png")
          EOF

      - name: Commit & Push updated graph
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add gitlab-commit-graph.png
          git diff --cached --quiet || git commit -m "update: GitLab commit graph [skip ci]"
          git pull --rebase
          git push
