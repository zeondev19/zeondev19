name: Update GitLab Commit Stats

on:
  schedule:
    - cron: "0 0 * * *"   # Setiap hari jam 00:00 UTC
  workflow_dispatch:       # Bisa dijalankan manual

jobs:
  gitlab_commits:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Ambil data commit GitLab (30 hari terakhir)
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          GITLAB_USERNAME: ${{ secrets.GITLAB_USERNAME }}
        run: |
          curl --header "PRIVATE-TOKEN: $GITLAB_TOKEN" \
            "https://gitlab.com/api/v4/users/$GITLAB_USERNAME/events?action=pushed" > gitlab_events.json

          # Hitung jumlah commit 30 hari terakhir
          COMMITS=$(jq '[.[] | select(.created_at >= "'$(date -d '30 days ago' --utc +%Y-%m-%d)'") ] | length' gitlab_events.json)
          echo "Total commit 30 hari terakhir di GitLab: $COMMITS"
          echo $COMMITS > gitlab_commit_count.txt

      - name: Update README.md
        run: |
          COUNT=$(cat gitlab_commit_count.txt)
          # Ganti atau tambahkan baris khusus di README
          if grep -q "GitLab commits 30 hari terakhir:" README.md; then
            sed -i "s/GitLab commits 30 hari terakhir:.*/GitLab commits 30 hari terakhir: $COUNT/g" README.md
          else
            echo "GitLab commits 30 hari terakhir: $COUNT" >> README.md
          fi

      - name: Commit & Push Perubahan
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Update GitLab commit stats [skip ci]" || exit 0
          git push
